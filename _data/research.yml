safety:
  name: Trust and safety, across all three
  short: Safety
  property: Trustworthy
  question: how far an agent can be trusted
  thesis: Trust has to be built in, then audited.
  summary: >-
    Our [critical review of LLM evaluation](https://aclanthology.org/2024.emnlp-main.764/) diagnoses why model comparisons mislead.
    [X-Teaming](https://arxiv.org/abs/2504.13203) red-teams multi-turn conversations with
    collaborating planner, attacker, and verifier agents;
    [Poison with Style](https://arxiv.org/abs/2605.27631) shows the code supply chain can be poisoned
    with almost no utility loss; [AI Debate](https://arxiv.org/abs/2506.02175) helps human judges
    assess disputed claims; and our [agentic security](https://arxiv.org/abs/2510.06445) survey and
    [AgentTell](https://arxiv.org/abs/2609.32915) map threats to agents, including behavioural
    side-channel leakage in browser-use agents.
  papers:
    - { name: X-Teaming, url: "https://arxiv.org/abs/2504.13203" }
    - { name: Poison with Style, url: "https://arxiv.org/abs/2605.27631" }
    - { name: AI Debate, url: "https://arxiv.org/abs/2506.02175" }
    - { name: Agentic Security, url: "https://arxiv.org/abs/2510.06445" }
    - { name: AgentTell, url: "https://arxiv.org/abs/2609.32915" }
  stages:
    - name: Evaluation
      papers: [{ name: "LLM evaluation review", url: "https://aclanthology.org/2024.emnlp-main.764/" }]
    - name: Red-teaming
      papers: [{ name: "X-Teaming", url: "https://arxiv.org/abs/2504.13203" }]
    - name: Code poisoning
      papers: [{ name: "PwS", url: "https://arxiv.org/abs/2605.27631" }]
    - name: Security of agents
      papers: [{ name: "CTF failure attribution" }, { name: "Agentic Security", url: "https://arxiv.org/abs/2510.06445" }, { name: "AgentTell", url: "https://arxiv.org/abs/2609.32915" }]
    - name: Oversight
      papers: [{ name: "AI Debate", url: "https://arxiv.org/abs/2506.02175" }]

future:
  - A unified, attributed, and safety-certified knowledge substrate for everything an agent consumes, from documents and memory to skills and tools.
  - A research platform for trustworthy human–AI software engineering across the full development lifecycle.
  - Agents that stay grounded as the physical and digital world changes under them.
