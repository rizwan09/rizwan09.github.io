bio:
  - >-
    I am a Scientist at the [Qatar Computing Research Institute (QCRI)](https://www.hbku.edu.qa/en/qcri),
    [Hamad Bin Khalifa University](https://www.hbku.edu.qa/), where I lead research on auditable
    language and coding agents. Before that, I was a Research Scientist at
    [Bosch Research](https://www.bosch.com/research/). I received my Ph.D. in Computer Science from the
    [University of California, Los Angeles](https://www.cs.ucla.edu/), where I worked with
    [Kai-Wei Chang](https://web.cs.ucla.edu/~kwchang/), and interned at Google Research, Meta FAIR,
    Salesforce Research, and Microsoft. My research focuses on natural language processing, machine
    learning, and software engineering, with the goal of building agents whose claims, code, and
    actions can be checked against evidence, execution, and the environment they act in, rather than
    taken on the model's word. Currently, my research includes three directions:
    (1) [attributed knowledge and retrieval-augmented generation](#thread-k), (2) [verifiable code
    generation and software engineering agents](#thread-c), and (3) [grounded agents for maps, the
    web, GUIs, and charts](#thread-a), together with (4) [the safety and security of these
    agents](#thread-s).
recruiting: >-
  I am actively looking for **research interns**, and I co-supervise **Ph.D. students** with
