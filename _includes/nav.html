<div class="topbar">
  <div class="topbar-inner">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
    <nav>
      {% assign cur = page.url | remove: 'index.html' %}
      {% for link in site.navbar-links %}
        {% assign full = '/' | append: link[1] | relative_url %}
        <a href="{{ full }}"{% if cur == full %} class="active"{% endif %}>{{ link[0] }}</a>
      {% endfor %}
    </nav>
  </div>
</div>
