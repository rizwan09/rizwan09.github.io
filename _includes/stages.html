<div class="stages">
  {% for st in include.stages %}
  <div class="stage">
    <div class="stage-name">{{ st.name }}</div>
    <div class="stage-papers">{% for p in st.papers %}{% if p.url %}<a href="{{ p.url }}">{{ p.name }}</a>{% else %}<span>{{ p.name }}</span>{% endif %}{% endfor %}</div>
  </div>
  {% endfor %}
</div>
