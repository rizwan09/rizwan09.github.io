{% assign r = site.data.research %}
<figure class="rmap" aria-label="How the research threads connect">
  <figcaption class="rmap-title">Auditable agents: four connected threads</figcaption>
  <div class="rmap-row">
    {% for t in r.thrusts %}
    <a class="rnode" href="#thread-{{ t.id }}" data-id="{{ t.id }}">
      <span class="rnode-icon">{% include icon.html name=t.icon %}</span>
      <span class="rnode-name">{{ t.name }}</span>
      <span class="rnode-prop">{{ t.property }}<span class="rnode-comp">{{ t.component }}</span></span>
      <span class="rnode-q">{{ t.question }}</span>
    </a>
    {% unless forloop.last %}
      {% assign nxt = r.thrusts[forloop.index].id %}
      <div class="rlink" data-ids="{{ t.id }} {{ nxt }}">
        {% for l in r.links %}
          {% if l.from == t.id and l.to == nxt %}
          <div class="arrow fwd"><span class="lbl">{{ l.label }}</span><span class="line"></span><span class="via">{{ l.via }}</span></div>
          {% elsif l.from == nxt and l.to == t.id %}
          <div class="arrow back"><span class="lbl">{{ l.label }}</span><span class="line"></span><span class="via">{{ l.via }}</span></div>
          {% endif %}
        {% endfor %}
      </div>
    {% endunless %}
    {% endfor %}
  </div>
  <a class="rsafety" href="#thread-s">
    <span class="rnode-icon">{% include icon.html name=r.safety.icon %}</span>
    <span class="rsafety-text">
      <span class="rnode-name">{{ r.safety.name }}</span>
      <span class="rnode-prop">{{ r.safety.property }}<span class="rnode-comp"> · {{ r.safety.component }} · {{ r.safety.scope }}</span></span>
    </span>
    <span class="rnode-q">{{ r.safety.question }}</span>
  </a>
</figure>
